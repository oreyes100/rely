# ============================================================
# RELY POS - Docker Compose para Producción
# Pozolería, Tacos y Enchiladas
# ============================================================

services:
  rely-pos:
    build: .
    container_name: rely-pos
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistir base de datos fuera del contenedor
      - ./data:/app/data
    environment:
      - PORT=8000
      - DB_PATH=/app/data/rely_pos.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
