# /etc/nginx/sites-available/vps-panel
# Panel de gestión VPS — HTTPS con cert auto-firmado (o Let's Encrypt si tienes dominio)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # Certificado (auto-firmado; ver README para generarlo, o certbot si hay dominio)
    ssl_certificate     /etc/nginx/ssl/panel.crt;
    ssl_certificate_key /etc/nginx/ssl/panel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cabeceras de seguridad — NO incluyen X-Frame-Options aquí a propósito;
    # el proxy de la consola Proxmox necesita poder embeber iframes desde este origen.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Frontend estático (build de Vite)
    root /opt/vps-panel/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── API del panel → backend Express ────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # El aprovisionamiento (clon completo) puede tardar varios minutos
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ── FossBilling (billing / portal de clientes) ───────────────────────────────
    # FossBilling corre en un server block separado en 127.0.0.1:8080 (ver abajo)
    location /fossbilling/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── Proxy de la UI de Proxmox (iframe) → backend Express ───────────────────
    # El backend ya elimina X-Frame-Options e inyecta el interceptor JS en el HTML.
    # Necesitamos upgrade para WebSocket (consola VNC/noVNC de Proxmox).
    location /proxmox/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket upgrade (VNC/SPICE en el iframe)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Sin límite de tamaño ni timeout corto para streams de consola
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# Necesario para la directiva $connection_upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── FossBilling: server block en 8080 (sólo localhost) ───────────────────────
# Instalación: /var/www/fossbilling  (ver scripts/setup-fossbilling.sh)
# PHP-FPM socket: /run/php/php8.3-fpm.sock  (ajustar versión si cambia)
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /var/www/fossbilling;
    index index.php;
    client_max_body_size 32m;

    location ~* \.(ini|sh|inc|bak|twig|sql)$ { return 404; }
    location ~* /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.php?_url=$uri&$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTPS on;
    }
}
